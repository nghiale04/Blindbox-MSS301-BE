# ======================
# APPLICATION INFO
# ======================
spring.application.name=cloud-gate-way
server.port=9090

# ======================
# SPRING CLOUD GATEWAY
# ======================
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.forwarded-headers-strategy=framework
server.forward-headers-strategy=framework

# Timeout settings
spring.cloud.gateway.httpclient.connect-timeout=30000
spring.cloud.gateway.httpclient.response-timeout=30s

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG
debug=true

# ======================
# JWT CONFIG
# ======================
app.jwt.secret=NghiaLHSE181765xm8aylVXZ3sZjW+M+pL6fZdhvI40NMGvHhZBsR2YAwY2Z4Ktn
app.jwt.access-ttl-seconds=900

# ======================
# CORS CONFIG
# ======================
# ?? Cho phép truy c?p t? domain th?t và local
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:9090,http://172.237.80.224:9090,http://172.31.48.1:5173}

# Gi? nguyên host và các header security khi forward
spring.cloud.gateway.default-filters[0]=PreserveHostHeader
spring.cloud.gateway.default-filters[1]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

# ======================
# SPRING CLOUD GATEWAY
# ======================
spring.cloud.gateway.routes[0].id=account-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/account-service/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/account-service/(?<segment>.*), /${segment}

spring.cloud.gateway.routes[1].id=blindbox-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/blindbox-service/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/blindbox-service/(?<segment>.*), /${segment}

spring.cloud.gateway.routes[2].id=brand-service
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/brand-service/**
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/brand-service/(?<segment>.*), /${segment}

# =========================
# SWAGGER AGGREGATION
# =========================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.urls[0].name=Account Service
springdoc.swagger-ui.urls[0].url=/account-service/v3/api-docs

springdoc.swagger-ui.urls[1].name=Brand Service
springdoc.swagger-ui.urls[1].url=/brand-service/v3/api-docs

springdoc.swagger-ui.urls[2].name=BlindBox Service
springdoc.swagger-ui.urls[2].url=/blindbox-service/v3/api-docs

# =========================
# TIMEZONE CONFIG
# =========================
spring.jackson.time-zone=Asia/Ho_Chi_Minh


spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=http://localhost:5173,http://172.31.48.1:5173,http://172.237.80.224:5173,http://172.237.80.224:9090,https://jennie-psychiatric-theresa.ngrok-free.dev
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true
